[tool.mypy]
python_version = "3.12"
strict = true

warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

disallow_untyped_defs = true
plugins = ['pydantic.mypy']

[tool.ruff.lint]
select = ["ALL"]

external = ["WPS"]

ignore = [
    # Avoid enforcing line-length violations (`E501`)
    "E501",
    # Avoid enforcing no-blank-line-before-class violations (`D211`)
    "D211",
    # Avoid enforcing multi-line-summary-second-line violations (`D213`)
    "D213",
    # Avoid enforcing Missing docstring in public package (`D104`) because nobody will read it.
    "D104",
    # Avoid enforcing Missing copyright notice at top of file (`CPY001`).
    "CPY001",
    # Avoid enforcing Use of assert detected (`S101`), because it can be useful for internal APIs, and we are not optimizing during deployment.
    "S101",
    # Avoid enforcing exception name should be named with an Error suffix, because we use Information and Warning level Exceptions as well.
    "N818",
    # The following rules may cause conflicts when used with the formatter: `COM812`
    "COM812",
]

# Fix isort violations (I)
# Fix flake8-type-checking violations (TC)
fixable = ["I", "TC"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Target Python 3.12 compatibility
target-version = "py312"

line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
