[tool.mypy]
python_version = "3.14"
strict = true

warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

disallow_untyped_defs = true

[tool.ruff.lint]
select = ["ALL"]

external = ["WPS"]

# Avoid enforcing line-length violations (`E501`)
# Avoid enforcing no-blank-line-before-class violations (`D211`)
# Avoid enforcing multi-line-summary-second-line violations (`D213`)
# Avoid enforcing Missing docstring in public package (`D104`) because nobody will read it.
# The following rules may cause conflicts when used with the formatter: `COM812`, `D203`
# The `format.indent-style="tab"` option is incompatible with `W191`
# The `format.indent-style="tab"` option is incompatible with `D206`
ignore = ["E501", "D211", "D213", "D104", "COM812", "D203", "W191", "D206"]

fixable = []
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Assume Python 3.14
target-version = "py314"

line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.lint.ruff.mccabe]
max-complexity = 10

[tool.lint.ruff.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[flake8]
extend-select = ["B901", "B902", "B903"]
ignore = [
    # Avoid enforcing Missing docstring in public package (`D104`) because nobody will read it.
    "D104",
    # Avoid f-string restrictions (`WPS305`, `WPS237`).
    "WPS305",
    "WPS237"
]
per-file-ignores = [
    # Avoid enforcing Use of `assert` detected (`S101`) in tests files because it makes no sense.
    # Avoid enforcing Found too many imported names from a module (`WPS235`) in tests files because it is valid for tests.
    # Avoid enforcing Found too many imports (`WPS201`) it needs some refactor.
    "**/tests/*:S101,WPS235,WPS201"
]
max_complexity = 10
max_line_length = 120
statistics = true
count = true
inline-quotes = "double"
# Relates to WPS226
max-string-usages = 5
# Relates to WPS118
max-name-length = 50
# Relates to WPS202
max-module-members = 20
# Relates to WPS210
max-local-variables = 10
# Relates to WPS229
max-try-body-length = 2
# Relates to WPS221
max-line-complexity = 20
# Relates to WPS201
max-imports = 15
# Relates to WPS214
max-methods = 10
docstring-convention = "google"
docstring_style = "google"
strictness = "long"
eradicate-aggressive = true
dictionaries = ["en_US", "python", "technical", "pandas"]

